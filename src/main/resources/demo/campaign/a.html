<!doctype html>
<html lang="en" data-world="candy" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>World Stage</title>
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/worlds.css">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="a.css">
</head>
<body class="ws">
    <canvas id="world-bg" aria-hidden="true"></canvas>
    <div id="overlay"></div>
    <div class="ws-veil" aria-hidden="true"></div>

    <header class="ws-bar">
        <button type="button" class="ws-round" id="ws-back" aria-label="Back to Home"></button>
        <div class="ws-title">
            <h1 id="ws-world">Candy Hills</h1>
            <p id="ws-where">World 4 of 15</p>
        </div>
        <div class="ws-status">
            <span class="ws-chip" id="ws-stars" title="Campaign stars"></span>
            <span class="ws-chip" id="ws-coins" title="Coins"></span>
            <button type="button" class="ws-pack-btn" id="ws-pack-open" aria-haspopup="dialog">Pack</button>
        </div>
    </header>

    <main class="ws-main">
        <section class="ws-stage" id="ws-stage" aria-label="Levels">
            <svg class="ws-road" id="ws-road" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
                <path class="ws-road-bed" id="ws-road-bed"/>
                <path class="ws-road-ahead" id="ws-road-ahead"/>
                <path class="ws-road-done" id="ws-road-done"/>
            </svg>
            <div class="ws-stops" id="ws-stops"></div>
            <button type="button" class="ws-edge prev" id="ws-prev"></button>
            <button type="button" class="ws-edge next" id="ws-next"></button>
            <div class="ws-locked" id="ws-locked" hidden></div>
        </section>
        <aside class="ws-panel" id="ws-panel" aria-live="polite"></aside>
    </main>

    <nav class="ws-strip" id="ws-strip" aria-label="Worlds"></nav>

    <div class="ws-pack" id="ws-pack" role="dialog" aria-modal="true" aria-labelledby="ws-pack-title" hidden>
        <div class="ws-pack-card">
            <header class="ws-pack-head">
                <h2 id="ws-pack-title">Pack</h2>
                <button type="button" class="ws-round" id="ws-pack-close" aria-label="Close"></button>
            </header>
            <div class="ws-tabs" role="tablist" id="ws-tabs"></div>
            <div class="ws-pack-body" id="ws-pack-body"></div>
        </div>
    </div>

    <p class="di-demo-mark">Demo · Sample Progress</p>

    <script src="/js/util.js"></script>
    <script src="/js/sound.js"></script>
    <script src="/js/fx.js"></script>
    <script src="/js/worlds.js"></script>
    <script src="/js/worlds/classic.js"></script>
    <script src="/js/worlds/paper.js"></script>
    <script src="/js/worlds/space.js"></script>
    <script src="/js/worlds/garden.js"></script>
    <script src="/js/worlds/arcade.js"></script>
    <script src="/js/worlds/snow.js"></script>
    <script src="/js/worlds/squirrel.js"></script>
    <script src="/js/worlds/ocean.js"></script>
    <script src="/js/worlds/candy.js"></script>
    <script src="/js/worlds/library.js"></script>
    <script src="/js/worlds/volcano.js"></script>
    <script src="/js/worlds/sky.js"></script>
    <script src="/js/worlds/desert.js"></script>
    <script src="/js/worlds/robot.js"></script>
    <script src="/js/worlds/carnival.js"></script>
    <script src="/js/worlds/rain.js"></script>
    <script src="/js/worlds/rift.js"></script>
    <script src="/js/companions.js"></script>
    <script src="/js/bosses.js"></script>
    <script src="/js/hero.js"></script>
    <script src="/js/powers.js"></script>
    <script src="common.js"></script>
    <script src="a.js"></script>
</body>
</html>
