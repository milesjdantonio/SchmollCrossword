<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Schmoll Crossword</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <h1>Schmoll Crossword</h1>
        <p class="subtitle">Daily puzzle · <span id="puzzle-date"></span></p>
    </header>

    <main>
        <!-- Difficulty picker: same grid, different clues -->
        <nav class="difficulty" aria-label="Difficulty">
            <button type="button" data-difficulty="easy">Easy</button>
            <button type="button" data-difficulty="medium" class="active">Medium</button>
            <button type="button" data-difficulty="hard">Hard</button>
        </nav>

        <p id="status" class="status">Loading today's puzzle…</p>

        <div class="puzzle" id="puzzle" hidden>
            <div class="board-area">
                <!-- Timer (Step 21) -->
                <div class="timer-row">
                    <span class="timer" id="timer" aria-label="Time">0:00</span>
                    <span class="points-today" id="points-today"></span>
                </div>
                <!-- "You solved it!" panel (Step 21); hidden until the grid is correct -->
                <div class="win" id="win" hidden>
                    <h2>You solved it!</h2>
                    <p id="win-details"></p>
                </div>
                <!-- The clue for the selected word -->
                <div class="clue-bar" id="clue-bar"></div>
                <!-- Check and Reveal (Step 22) -->
                <div class="helpers" id="helpers">
                    <div class="helper-row">
                        <span class="helper-label">Check</span>
                        <button type="button" data-action="check" data-scope="square">Square</button>
                        <button type="button" data-action="check" data-scope="word">Word</button>
                        <button type="button" data-action="check" data-scope="puzzle">Puzzle</button>
                    </div>
                    <div class="helper-row">
                        <span class="helper-label">Reveal</span>
                        <button type="button" data-action="reveal" data-scope="square">Square</button>
                        <button type="button" data-action="reveal" data-scope="word">Word</button>
                        <button type="button" data-action="reveal" data-scope="puzzle">Puzzle</button>
                    </div>
                </div>
                <!-- The 5x5 board; app.js fills it with squares -->
                <div class="board" id="board" aria-label="Crossword grid"></div>
            </div>

            <!-- The clue lists; app.js fills them -->
            <section class="clues">
                <div>
                    <h2>Across</h2>
                    <ol id="across-clues"></ol>
                </div>
                <div>
                    <h2>Down</h2>
                    <ol id="down-clues"></ol>
                </div>
            </section>
        </div>
    </main>

    <script src="score.js"></script>
    <script src="app.js"></script>
</body>
</html>
