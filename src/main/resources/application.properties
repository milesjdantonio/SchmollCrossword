# Schmoll Crossword server settings (Step 26). Spring Boot reads this file when the server starts.
# ${NAME:default} means "use the environment variable NAME if the host sets it, otherwise the default".

# The port the website listens on. Hosts like Render and Railway tell the app which port to use through PORT.
server.port=${PORT:8080}

# Online, requests reach the app through the host's proxy, so getRemoteAddr() would be the proxy's address.
# This makes it read the player's real address from the proxy's X-Forwarded-For header instead
# (only when the request comes from a trusted, internal proxy, so players can't fake it).
server.forward-headers-strategy=native

# Dailies made ahead of time (DailyMaker): how many days past today to keep ready (0 = off, the default, so a
# development server never pays for puzzles by itself), how many it may make per run, and how often it looks.
# Each daily costs a Claude call or two: 5 puzzles a day, a few cents in all.
schmoll.dailies.days-ahead=${MAKE_DAILIES_AHEAD:0}
schmoll.dailies.max-per-run=${MAX_DAILIES_PER_RUN:12}
schmoll.dailies.first-check=PT2M
schmoll.dailies.check-every=PT1H

# The developer's daily email (DailyEmail): sent only when the host sets SPRING_MAIL_HOST, SPRING_MAIL_USERNAME and
# SPRING_MAIL_PASSWORD (SPRING_MAIL_PORT if it isn't 587) and REPORT_EMAIL_TO. Gmail: smtp.gmail.com with an App
# Password. The time is the server's (TZ).
schmoll.email.to=${REPORT_EMAIL_TO:}
schmoll.email.from=${REPORT_EMAIL_FROM:}
schmoll.email.cron=0 0 8 * * *
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Design options to pick from at /demo (DemoPages): on for a local server, off in the Dockerfile (SHOW_DEMO=false)
schmoll.demo=${SHOW_DEMO:true}

# Browsers must check for a newer version of the website's files on every visit (a quick "not modified" answer
# when nothing changed). Without this they may keep an old game.js after an update, so new buttons do nothing.
spring.web.resources.cache.cachecontrol.no-cache=true

# Compress text responses (JS, CSS, HTML, JSON): the site's code is ~1.8 MB, about a quarter of that gzipped.
# Audio is already compressed, so it's left out.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml,text/plain,font/ttf,application/x-font-ttf
server.compression.min-response-size=1024
