# Schmoll Crossword server settings (Step 26). Spring Boot reads this file when the server starts.
# ${NAME:default} means "use the environment variable NAME if the host sets it, otherwise the default".

# The port the website listens on. Hosts like Render and Railway tell the app which port to use through PORT.
server.port=${PORT:8080}

# Online, requests reach the app through the host's proxy, so getRemoteAddr() would be the proxy's address.
# This makes it read the player's real address from the proxy's X-Forwarded-For header instead
# (only when the request comes from a trusted, internal proxy, so players can't fake it).
server.forward-headers-strategy=native

# Rate limit for Unlimited: each one is a paid Claude call (see RateLimiter.java)
schmoll.unlimited.per-person-per-hour=${UNLIMITED_PER_PERSON_PER_HOUR:10}
schmoll.unlimited.everyone-per-day=${UNLIMITED_EVERYONE_PER_DAY:200}
