# Schmoll Crossword server settings (Step 26). Spring Boot reads this file when the server starts.
# ${NAME:default} means "use the environment variable NAME if the host sets it, otherwise the default".

# The port the website listens on. Hosts like Render and Railway tell the app which port to use through PORT.
server.port=${PORT:8080}

# Online, requests reach the app through the host's proxy, so getRemoteAddr() would be the proxy's address.
# This makes it read the player's real address from the proxy's X-Forwarded-For header instead
# (only when the request comes from a trusted, internal proxy, so players can't fake it).
server.forward-headers-strategy=native

# Rate limit for Unlimited: each one is a paid Claude call (see RateLimiter.java)
# Each player may make 10 Unlimited puzzles in any 24 hours (the dailies don't count; they're free)
# and everyone together 200 a day, so a flood of players can't run up a big bill
schmoll.unlimited.per-person-per-day=${UNLIMITED_PER_PERSON_PER_DAY:10}
schmoll.unlimited.everyone-per-day=${UNLIMITED_EVERYONE_PER_DAY:200}

# Browsers must check for a newer version of the website's files on every visit (a quick "not modified" answer
# when nothing changed). Without this they may keep an old game.js after an update, so new buttons do nothing.
spring.web.resources.cache.cachecontrol.no-cache=true

# Compress text responses (JS, CSS, HTML, JSON): the site's code is ~1.8 MB, about a quarter of that gzipped.
# Audio is already compressed, so it's left out.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml,text/plain,font/ttf,application/x-font-ttf
server.compression.min-response-size=1024
